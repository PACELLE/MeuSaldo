<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MeuSaldo - Controle Financeiro</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- Cabeçalho -->
        <header>
            <h1>MeuSaldo</h1>
        </header>
        <main>
            <!-- Resumo do Saldo -->
            <section class="saldo">
                <h2>Saldo Atual</h2>
                <p id="saldoTotal" class="saldo-valor">R$ 0,00</p>
            </section>

            <!-- Formulário de Entrada de lançamentos -->
            <section class="formulario">
                <h2>Novo Lançamento</h2>

                <form id="formLancamento">
                    <div class="Campos">
                        <label for="Tipo">Tipo:</label>
                        <select id="Tipo" required>
                            <option value="receita">(+) Receita</option>
                            <option value="despesa">(-) Despesa</option>
                        </select>
                    </div>

                    <div class="Campos">
                        <label for="Categoria">Categoria:</label>
                        <input type="text" id="Categoria" placeholder="EX: Salário,Alimentação, Transporte, etc." required>
                    </div>

                    <div class="Campos">
                        <label for="Data">Data:</label>
                        <input type="date" id="Data" required>
                    </div>

                    <div class="Campos">
                        <label for="Valor">Valor (R$):</label>
                        <input type="number" id="Valor" step="0.01" min="0.01" placeholder="0,00" required>
                    </div>

                    <button type="submit" id="btnAdicionar">Adicionar Lançamento</button>
                </form>

                <!-- Mensagem de erro -->
                <p id="mensagemErro" class="mensagem-erro" aria-live="polite"></p>
            </section>

            <!-- Resultados dos lançamentos -->
            <section class="resultados">
                <h2>Histórico de Lançamentos</h2>
                <ul id="listaLancamentos" class="lista-lancamentos">
                    <!-- Listagem de lançamentos via JS -->
                </ul>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 MeuSaldo. Todos os direitos reservados.</p>
        </footer>

        <script src="app.js"></script>
    </body>
    
</html>
